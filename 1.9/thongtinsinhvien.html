<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin sinh viên</title>
</head>
<body>
    <div>
        <h1>THÔNG TIN SINH VIÊN</h1>

        <form action="#">
        <div>
            <label for="MSV">Mã sinh viên:</label>
            <input type="text" id="MSV" placeholder="Nhập mã sinh viên" required>
        </div>
        <div>
            <label for="ho_ten">Họ và tên:</label>
            <input type="text" name="ho_ten" id="hoten" placeholder="Nhập họ và tên">
        </div>
        <div>
            <label for="ngay_sinh">Ngày sinh: </label>
            <input type="date" name="ngay_sinh" id="ngaysinh">
        </div>
        <div>
            <label for="email">Email: </label>
            <input type="email" name="email" id="mail" placeholder="example@gmail.com">
        </div>
        <div>
            <label for="So_dien_thoai">Số điện thoại: </label>
            <input type="number" name="So_dien_thoai" id="sđt" placeholder="Nhập số điện thoại">
        </div>
        <div>
            <button type="submit">Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </div>
        </form>
        
    </div>
</body>
</html>
