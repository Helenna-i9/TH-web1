<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin giản viên</title>
</head>
<body>
    <div>
        <form action="#" method="post">
            <div>
                <label for="MGV">Mã giản viên: </label>
                <input type="text" name="MGV" id="mgv" placeholder="Nhập mã giản viên" required>
            </div>
            <div>
            <label for="ho_ten">Họ và tên:</label>
            <input type="text" name="ho_ten" id="hoten" placeholder="Nhập họ và tên" required>
        </div>
        <div>
            <label for="ngay_sinh">Ngày sinh: </label>
            <input type="date" name="ngay_sinh" id="ngaysinh" required>
        </div>
        <div>
            <label for="email">Email: </label>
            <input type="email" name="email" id="mail" placeholder="example@gmail.com" required>
        </div>
        <div>
            <label for="So_dien_thoai">Số điện thoại: </label>
            <input type="number" name="So_dien_thoai" id="sđt" placeholder="Nhập số điện thoại">
        </div>
        <div>
            <button type="submit">Lưu thông tin</button>
        </div>
        </form>
    </div>
</body>
</html>
